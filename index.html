<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #111111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    padding: 40px 20px;
  }

  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.02)} }
  @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Eyebrow label */
  .eyebrow {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0em;
    text-transform: none;
    color: #FFFFFF;
    margin-bottom: 48px;
  }

  /* Ring */
  #ring-wrap {
    position: relative;
    width: 300px;
    height: 300px;
  }
  #ring-wrap svg { display: block; pointer-events: none; }
  #center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }
  #time-display {
    font-size: 58px;
    font-weight: 800;
    line-height: 1;
    color: #FFFFFF;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    transition: color 0.4s;
  }
  #hint-pill {
    display: inline-flex;
    align-items: center;
    background: #1E1E1E;
    border: 1px solid #2A2A2A;
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #555555;
    transition: all 0.2s;
  }

  /* Controls */
  #controls {
    margin-top: 36px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn {
    border-radius: 100px;
    padding: 10px 26px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    letter-spacing: 0.01em;
  }
  .btn.primary {
    background: #FFFFFF;
    color: #111111;
  }
  .btn.primary:hover { background: #E8E8E8; }
  .btn.ghost {
    background: transparent;
    color: #555555;
    border: 1px solid #2A2A2A;
  }
  .btn.ghost:hover { border-color: #555555; color: #AAAAAA; }
  .btn.danger {
    background: transparent;
    color: #888888;
    border: 1px solid #2A2A2A;
  }

  /* Footer hint */
  #footer {
    margin-top: 20px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: #2A2A2A;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="eyebrow">Workshop timer</div>

<div id="ring-wrap">
  <svg id="svg" width="300" height="300">
    <circle cx="150" cy="150" r="116" fill="none" stroke="#1E1E1E" stroke-width="68"/>
    <path id="arc" fill="none" stroke-width="68" stroke-linecap="butt"/>
    <circle cx="150" cy="150" r="92" fill="#111111"/>
    <circle id="handle" cx="150" cy="34" r="9" fill="#111111" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="148.5" y="-1" width="3" height="69" fill="#111111"/>
  </svg>
  <div id="center">
    <div id="time-display">05:00</div>
    <div id="hint-pill">Dra for å stille</div>
  </div>
</div>

<div id="controls">
  <button class="btn primary" id="btn-main">Start</button>
</div>
<div id="footer">1 – 59 min</div>

<script>
const MAX_MIN = 59, R = 116, CX = 150, CY = 150, SIZE = 300;

function pad(n) { return String(n).padStart(2,'0'); }
function fmt(s) { return pad(Math.floor(s/60))+':'+pad(s%60); }

function arcPath(frac) {
  if (frac <= 0) return '';
  const f = Math.min(frac, 0.9999);
  const a = f * 2 * Math.PI;
  const ex = CX + R * Math.sin(a), ey = CY - R * Math.cos(a);
  return 'M '+CX+' '+(CY-R)+' A '+R+' '+R+' 0 '+(f>0.5?1:0)+' 1 '+ex+' '+ey;
}

function arcColor(frac, fin) {
  if (fin) return '#dc2626';
  if (frac > 0.5) return '#FFFFFF';
  if (frac > 0.2) return '#d97706';
  return '#dc2626';
}

// --- State ---
let mode = 'set', setMins = 5;
let total = 300, remaining = 300;
let running = false, finished = false;
let ticker = null, dragging = false, endsAt = null;

function parseSlug() {
  const parts = location.pathname.replace(/^\/+/,'').split('/');
  const nums = parts.filter(p => /^\d+$/.test(p));
  const minutes = nums.length ? Math.max(1,Math.min(MAX_MIN,parseInt(nums[0]))) : null;
  return { minutes, auto: parts.includes('auto') };
}

// --- Render ---
function render() {
  const frac = mode === 'set' ? setMins/MAX_MIN : (total > 0 ? remaining/total : 0);

  // Arc
  const arcEl = document.getElementById('arc');
  arcEl.setAttribute('d', arcPath(frac));
  arcEl.setAttribute('stroke', mode === 'set' ? '#FFFFFF' : arcColor(frac, finished));
  arcEl.setAttribute('opacity', finished ? '0.25' : '1');

  // Handle
  const handle = document.getElementById('handle');
  if (mode === 'set') {
    handle.style.display = '';
    const a = (setMins/MAX_MIN) * 2 * Math.PI;
    handle.setAttribute('cx', CX + R * Math.sin(a));
    handle.setAttribute('cy', CY - R * Math.cos(a));
  } else {
    handle.style.display = 'none';
  }

  // Time
  const timeEl = document.getElementById('time-display');
  timeEl.textContent = mode === 'set' ? pad(setMins)+':00' : fmt(remaining);
  timeEl.style.color = finished ? '#dc2626' : '#FFFFFF';
  if (finished) {
    timeEl.style.animation = 'flash 1s ease-in-out infinite';
  } else {
    timeEl.style.animation = '';
  }

  // Hint pill
  const hint = document.getElementById('hint-pill');
  if (mode === 'set') {
    hint.textContent = 'Dra for å stille';
    hint.style.background = '#1E1E1E';
    hint.style.borderColor = '#2A2A2A';
    hint.style.color = '#555555';
  } else if (finished) {
    hint.textContent = 'Tid ute';
    hint.style.background = '#2A0A0A';
    hint.style.borderColor = '#5A1A1A';
    hint.style.color = '#dc2626';
  } else if (running) {
    hint.textContent = 'Trykk for pause';
    hint.style.background = '#1E1E1E';
    hint.style.borderColor = '#2A2A2A';
    hint.style.color = '#555555';
  } else {
    hint.textContent = 'Pauset';
    hint.style.background = '#1E2A1E';
    hint.style.borderColor = '#2A4A2A';
    hint.style.color = '#15803d';
  }

  // Pulse
  const wrap = document.getElementById('ring-wrap');
  const urgent = mode === 'run' && frac <= 0.1 && frac > 0 && running;
  wrap.style.animation = urgent ? 'pulse 1s ease-in-out infinite' : '';
  wrap.style.cursor = mode === 'set' ? 'crosshair' : 'default';

  // Controls
  const controls = document.getElementById('controls');
  const footer = document.getElementById('footer');

  if (mode === 'set') {
    controls.innerHTML = '<button class="btn primary" id="btn-main">Start</button>';
    document.getElementById('btn-main').onclick = startTimer;
    footer.textContent = '1 – 59 min';
  } else if (finished) {
    controls.innerHTML = '<button class="btn primary" id="btn-main">Ny runde</button>';
    document.getElementById('btn-main').onclick = backToSet;
    footer.textContent = '';
  } else {
    controls.innerHTML =
      '<button class="btn ghost" id="btn-back">\u2190 Endre tid</button>' +
      '<button class="btn primary" id="btn-main">'+(running ? 'Pause' : 'Fortsett')+'</button>';
    document.getElementById('btn-back').onclick = backToSet;
    document.getElementById('btn-main').onclick = togglePause;
    footer.textContent = '';
  }
}

// --- Actions ---
function startTimer() {
  total = setMins * 60; remaining = total;
  finished = false; mode = 'run'; running = true;
  startTick(); render();
}
function togglePause() {
  if (finished) return;
  running = !running;
  if (running) { endsAt = Date.now() + remaining * 1000; startTick(); }
  else stopTick();
  render();
}
function backToSet() {
  stopTick(); running = false; finished = false; mode = 'set'; render();
}

// --- Tick (wall-clock) ---
function startTick() {
  stopTick();
  endsAt = Date.now() + remaining * 1000;
  ticker = setInterval(tick, 250);
}
function tick() {
  if (!running) return;
  const left = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
  if (left !== remaining) {
    remaining = left;
    if (remaining <= 0) {
      remaining = 0; stopTick(); running = false; finished = true; playDone();
    }
    render();
  }
}
function stopTick() { if (ticker) { clearInterval(ticker); ticker = null; } }

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && running && endsAt) tick();
});

// --- Audio ---
function playDone() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.2;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.22, t+0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.55);
      osc.start(t); osc.stop(t+0.6);
    });
  } catch(e) {}
}

// --- Drag ---
function getAngle(e) {
  const rect = document.getElementById('ring-wrap').getBoundingClientRect();
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return Math.atan2(clientX-cx, -(clientY-cy));
}
function isOnRing(e) {
  const rect = document.getElementById('ring-wrap').getBoundingClientRect();
  const scale = rect.width/SIZE;
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const dist = Math.sqrt((clientX-cx)**2+(clientY-cy)**2);
  return dist >= (R-34)*scale && dist <= (R+34)*scale;
}
function angleToMins(a) {
  let deg = a*180/Math.PI;
  if (deg < 0) deg += 360;
  return Math.max(1, Math.min(MAX_MIN, Math.round(deg/360*MAX_MIN)));
}

const wrap = document.getElementById('ring-wrap');
wrap.addEventListener('pointerdown', e => {
  if (mode !== 'set' || !isOnRing(e)) return;
  dragging = true; setMins = angleToMins(getAngle(e)); render(); e.preventDefault();
});
wrap.addEventListener('touchstart', e => {
  if (mode !== 'set' || !isOnRing(e)) return;
  dragging = true; setMins = angleToMins(getAngle(e)); render(); e.preventDefault();
}, { passive: false });
window.addEventListener('pointermove', e => { if (!dragging) return; setMins = angleToMins(getAngle(e)); render(); });
window.addEventListener('touchmove', e => { if (!dragging) return; setMins = angleToMins(getAngle(e)); render(); e.preventDefault(); }, { passive: false });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('touchend', () => { dragging = false; });
document.getElementById('center').addEventListener('click', () => {
  if (mode === 'set') startTimer(); else togglePause();
});

// --- Init ---
const slug = parseSlug();
if (slug.minutes) {
  setMins = slug.minutes; total = setMins*60; remaining = total;
  if (slug.auto) { mode = 'run'; running = true; startTick(); }
}
render();
</script>
</body>
</html>
